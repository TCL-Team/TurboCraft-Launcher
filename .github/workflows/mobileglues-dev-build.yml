name: Build patched MobileGlues

# Temporary helper: builds the fixed MobileGlues (2.0.1-dev series, the one that
# carries the "strip uniform initialisers by token" fix) for Android and parks
# the resulting libmobileglues.so files on the branch, so they can be dropped
# into TCL/libs/MobileGlues-release.aar.
#
# Triggered by editing .mg-build-request (JSON) and pushing, because
# workflow_dispatch is only available once this file sits on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - ".mg-build-request"

permissions:
  contents: write

concurrency:
  group: mg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Read build request
        id: req
        run: |
          set -euo pipefail
          FILE=".mg-build-request"
          [ -f "$FILE" ] || echo '{"mg_ref":"7bb2325befc47a687305374b839b49ba4f82a47b","abis":["arm64-v8a"],"target_branch":"arena/e61cca19-turbocraft-launcher"}' > "$FILE"
          MG_REF=$(python3 -c "import json;print(json.load(open('$FILE'))['mg_ref'])")
          ABIS=$(python3 -c "import json;print(','.join(json.load(open('$FILE'))['abis']))")
          TARGET=$(python3 -c "import json;print(json.load(open('$FILE'))['target_branch'])")
          echo "mg_ref=$MG_REF" >> "$GITHUB_OUTPUT"
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Building $MG_REF for $ABIS -> $TARGET"

      - name: Checkout MobileGlues
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: ${{ steps.req.outputs.mg_ref }}
          path: mg
          submodules: false
          fetch-depth: 1

      - name: Fetch build submodules
        working-directory: mg
        run: |
          git submodule update --init \
            MobileGlues-cpp/3rdparty/glslang \
            MobileGlues-cpp/3rdparty/SPIRV-Cross \
            MobileGlues-cpp/3rdparty/xxhash \
            MobileGlues-cpp/include/ska

      - name: Locate Android NDK
        run: |
          set -euo pipefail
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"
          cmake --version | head -1

      - name: Build and publish each ABI
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MG_REF: ${{ steps.req.outputs.mg_ref }}
          ABIS: ${{ steps.req.outputs.abis }}
          TARGET_BRANCH: ${{ steps.req.outputs.target_branch }}
        run: |
          set -uo pipefail
          mkdir -p out
          failed=""
          IFS=',' read -ra ABI_LIST <<< "$ABIS"
          for ABI in "${ABI_LIST[@]}"; do
            echo "::group::Building $ABI"
            {
              cmake -S mg/MobileGlues-cpp -B "build-$ABI" \
                -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$ABI" \
                -DANDROID_PLATFORM=android-21 \
                -DANDROID_STL=c++_static \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              && cmake --build "build-$ABI" --target mobileglues -j"$(nproc)"
            } > "build-$ABI.log" 2>&1
            if [ $? -eq 0 ]; then
              cp "build-$ABI/libmobileglues.so" "out/libmobileglues-$ABI.so"
              echo "built $ABI: $(stat -c%s "out/libmobileglues-$ABI.so") bytes"
              # Publish right away so the important ABI is available early.
              rm -rf pubbranch
              git clone --depth 1 --branch "$TARGET_BRANCH" \
                "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" pubbranch
              mkdir -p pubbranch/.mg-build
              cp "out/libmobileglues-$ABI.so" pubbranch/.mg-build/
              ( cd pubbranch \
                && git config user.name "tcl-ci" \
                && git config user.email "ci@turbocraft-launcher.local" \
                && git add .mg-build \
                && { git commit -m "chore(mg-build): libmobileglues $ABI from $MG_REF" || true; } \
                && git push )
            else
              echo "::error::Build failed for $ABI"
              failed="$failed $ABI"
              tail -n 200 "build-$ABI.log" || true
              rm -rf pubbranch
              git clone --depth 1 --branch "$TARGET_BRANCH" \
                "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" pubbranch
              mkdir -p pubbranch/.mg-build
              tail -n 400 "build-$ABI.log" > "pubbranch/.mg-build/build-log-$ABI.txt" || true
              ( cd pubbranch \
                && git config user.name "tcl-ci" \
                && git config user.email "ci@turbocraft-launcher.local" \
                && git add .mg-build \
                && { git commit -m "chore(mg-build): failure log for $ABI" || true; } \
                && git push ) || true
            fi
            echo "::endgroup::"
          done
          ls -l out || true
          if [ -n "$failed" ]; then
            echo "::error::Failed ABIs:$failed"
            exit 1
          fi
