name: Build patched MobileGlues

# Temporary helper: builds the fixed MobileGlues (2.0.1-dev series, the one that
# carries the "strip uniform initialisers by token" fix) for Android and parks
# the resulting libmobileglues.so files on the branch, so they can be dropped
# into TCL/libs/MobileGlues-release.aar.
on:
  workflow_dispatch:
    inputs:
      mg_ref:
        description: "MobileGlues commit / branch to build"
        default: "7bb2325befc47a687305374b839b49ba4f82a47b"
        required: true
      abis:
        description: "Comma separated ABIs"
        default: "arm64-v8a,armeabi-v7a,x86,x86_64"
        required: true
      target_branch:
        description: "Branch that receives the built .so files"
        default: "arena/e61cca19-turbocraft-launcher"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout MobileGlues
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: ${{ inputs.mg_ref }}
          path: mg
          submodules: false
          fetch-depth: 1

      - name: Fetch build submodules
        working-directory: mg
        run: |
          git submodule update --init \
            MobileGlues-cpp/3rdparty/glslang \
            MobileGlues-cpp/3rdparty/SPIRV-Cross \
            MobileGlues-cpp/3rdparty/xxhash \
            MobileGlues-cpp/include/ska

      - name: Locate Android NDK
        run: |
          set -euo pipefail
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"
          cmake --version | head -1

      - name: Build and publish each ABI
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p out
          failed=""
          IFS=',' read -ra ABIS <<< "${{ inputs.abis }}"
          for ABI in "${ABIS[@]}"; do
            echo "::group::Building $ABI"
            if cmake -S mg/MobileGlues-cpp -B "build-$ABI" \
                 -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
                 -DANDROID_ABI="$ABI" \
                 -DANDROID_PLATFORM=android-21 \
                 -DANDROID_STL=c++_static \
                 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
               && cmake --build "build-$ABI" --target mobileglues -j"$(nproc)"; then
              cp "build-$ABI/libmobileglues.so" "out/libmobileglues-$ABI.so"
              echo "built $ABI: $(stat -c%s "out/libmobileglues-$ABI.so") bytes"
              # Publish right away so the important ABI is available early.
              rm -rf pubbranch
              git clone --depth 1 --branch "${{ inputs.target_branch }}" \
                "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" pubbranch
              mkdir -p pubbranch/.mg-build
              cp "out/libmobileglues-$ABI.so" pubbranch/.mg-build/
              ( cd pubbranch \
                && git config user.name "tcl-ci" \
                && git config user.email "ci@turbocraft-launcher.local" \
                && git add .mg-build \
                && { git commit -m "chore(mg-build): libmobileglues $ABI from ${{ inputs.mg_ref }}" || true; } \
                && git push )
            else
              echo "::error::Build failed for $ABI"
              failed="$failed $ABI"
            fi
            echo "::endgroup::"
          done
          ls -l out || true
          if [ -n "$failed" ]; then
            echo "::error::Failed ABIs:$failed"
            exit 1
          fi
