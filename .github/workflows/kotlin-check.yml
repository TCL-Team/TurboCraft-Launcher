name: Kotlin Check

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile Kotlin (debug variant)
        id: compile
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :TCL:compileDebugKotlin --console=plain 2>&1 | tee kotlin-check.log
          exit ${PIPESTATUS[0]}

      # Raw job logs are not reliably retrievable through the API, so surface compiler errors
      # as check-run annotations (GitHub renders at most 10 per step).
      - name: Report compiler errors
        if: steps.compile.outcome == 'failure'
        run: |
          python3 - <<'PYEOF'
          import re, os, subprocess

          lines, seen = [], set()
          with open("kotlin-check.log", errors="ignore") as fh:
              for raw in fh:
                  line = raw.rstrip()
                  clean = re.sub(r"^\[\s*\d+%\]\s*", "", line.strip())
                  if not (clean.startswith("e: ") or "error:" in clean or "FAILURE:" in clean
                          or "What went wrong" in clean or clean.startswith("> Task") and "FAILED" in clean
                          or clean.startswith("Caused by")):
                      continue
                  clean = clean.replace("file:///home/runner/work/TurboCraft-Launcher/TurboCraft-Launcher/", "")
                  if clean in seen:
                      continue
                  seen.add(clean)
                  lines.append(clean)

          summary = "\n".join(lines[:400]) or "(no compiler lines captured)"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Kotlin compile errors\n\n```\n" + summary + "\n```\n")

          chunks = [lines[i:i + 6] for i in range(0, min(len(lines), 120), 6)]
          for idx, chunk in enumerate(chunks[:10], 1):
              text = "\n".join(chunk).replace("%", "%25").replace("\r", " ").replace("\n", "%0A")[:4000]
              print(f"::error title=kotlin-{idx}::{text}")
          PYEOF

      - name: Result
        if: steps.compile.outcome == 'failure'
        run: exit 1
