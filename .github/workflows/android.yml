name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Missing NDK/SDK components auto-install karega aur license accept karega
      - name: Setup Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "platforms;android-37" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          # GitHub API rate-limit fix: is token ko build.gradle.kts mein use karo
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :TCL:assembleDebug

      - name: Find APK
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCL-debug
          path: |
            TCL/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
