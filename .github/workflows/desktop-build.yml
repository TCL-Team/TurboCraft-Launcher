name: Desktop Build

# TurboCraft Launcher — PC (Windows) edition
# Android build se bilkul alag: `desktop/` ka apna standalone Gradle build hai.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile (Kotlin / Compose Desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Compile errors ko workflow annotations me convert karta hai, taaki
      # PR/run page par seedha error dikhe (log download ke bina bhi).
      - name: Compile Kotlin
        run: |
          set -o pipefail
          gradle compileKotlin --stacktrace --console=plain 2>&1 | tee compile.log

      - name: Surface compile errors
        if: failure()
        run: |
          grep -E '^e: |error:' compile.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::error::last lines: $(tail -5 compile.log | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Unit tests (core)
        run: gradle test --stacktrace --console=plain

      - name: Build jar
        run: gradle jar --stacktrace --console=plain

  smoke:
    name: Smoke test (app starts under Xvfb)
    needs: compile
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Window khol kar 40s chhod dete hain — startup crash pakadne ke liye.
      - name: Run launcher headless
        env:
          SKIKO_RENDER_API: SOFTWARE
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1
          set +e
          xvfb-run -a timeout 90 gradle run --console=plain > run.log 2>&1
          code=$?
          echo "exit code: $code (124 = timeout = window khula aur chalta raha)"
          tail -25 run.log
          if grep -qE "Exception in thread|NoClassDefFoundError|ExceptionInInitializerError" run.log; then
            grep -E "Exception in thread|NoClassDefFoundError|ExceptionInInitializerError" run.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          exit 0

  package:
    name: Package (Windows exe)
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Create distributable app image
        run: gradle createDistributable --stacktrace --console=plain

      - name: Package MSI (WiX)
        continue-on-error: true
        run: gradle packageMsi --stacktrace --console=plain

      # Zip ke andar ek top-level folder + "pehle extract karo" README rakhte hain.
      # Warna user zip ke andar se seedha .exe dabaa deta hai aur jpackage
      # "app\<name>.cfg: No such file or directory" error deta hai.
      - name: Zip portable app image
        run: |
          cd build/compose/binaries/main/app
          APP_DIR=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_DIR")
          cat > "$APP_DIR/README-PEHLE-PADHO.txt" <<'TXT'
          TurboCraft Launcher (portable)
          ==============================
          ZAROORI: Pehle is zip ko extract karo, phir .exe chalao.
          Zip ke andar se seedha exe dabane par "app\...cfg: No such file
          or directory" error aata hai — kyunki Windows zip ko temp me
          kholta hai aur saath ke app/ + runtime/ folders wahan nahi hote.

          1. Zip par right click -> "Extract All..."
          2. Extract hui folder me jaakar launcher ka .exe chalao
          3. Settings me RAM aur Java apne hisaab se set kar lo

          Agar install karna aasan lage to MSI use karo.
          TXT
          powershell -Command "Compress-Archive -Path '$APP_NAME' -DestinationPath '$APP_NAME-windows-portable.zip' -Force"
          echo "PORTABLE_ZIP=$APP_NAME-windows-portable.zip" >> "$GITHUB_ENV"

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-portable
          path: desktop/build/compose/binaries/main/app/*-windows-portable.zip
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: launcher-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
