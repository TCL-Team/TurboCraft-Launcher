name: Desktop Build

# TurboCraft Launcher — PC (Windows) edition
# Android build se bilkul alag: `desktop/` ka apna standalone Gradle build hai.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. desktop-v0.1.0). Khaali = sirf build"
        required: false
        default: ""
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile (Kotlin / Compose Desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Compile errors ko workflow annotations me convert karta hai, taaki
      # PR/run page par seedha error dikhe (log download ke bina bhi).
      - name: Compile Kotlin
        run: |
          set -o pipefail
          gradle compileKotlin --stacktrace --console=plain 2>&1 | tee compile.log

      - name: Surface compile errors
        if: failure()
        run: |
          grep -E '^e: |error:' compile.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::error::last lines: $(tail -5 compile.log | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Build jar
        run: gradle jar --stacktrace --console=plain

  package:
    name: Package (Windows exe)
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Create distributable app image
        run: gradle createDistributable --stacktrace --console=plain

      - name: Package MSI (WiX)
        continue-on-error: true
        run: gradle packageMsi --stacktrace --console=plain

      - name: Zip portable app image
        run: |
          cd build/compose/binaries/main/app
          powershell -Command "Compress-Archive -Path 'TurboCraftLauncher/*' -DestinationPath 'TurboCraftLauncher-windows-portable.zip' -Force"

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: TurboCraftLauncher-windows
          path: |
            desktop/build/compose/binaries/main/app/TurboCraftLauncher-windows-portable.zip
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: TurboCraftLauncher-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore

  release:
    name: Publish Windows release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build app image + MSI
        run: |
          gradle createDistributable --stacktrace --console=plain
          gradle packageMsi --stacktrace --console=plain

      - name: Pack assets
        run: |
          TAG="${{ inputs.release_tag }}"
          cd build/compose/binaries/main/app
          powershell -Command "Compress-Archive -Path 'TurboCraftLauncher/*' -DestinationPath 'TurboCraftLauncher-${TAG}-windows-portable.zip' -Force"
          cp "TurboCraftLauncher-${TAG}-windows-portable.zip" "$GITHUB_WORKSPACE/"

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          cd "$GITHUB_WORKSPACE"
          NOTES="## TurboCraft Launcher — Windows ($TAG)

          PC edition ka pehla working MVP (naya Kotlin core, Compose Desktop UI).

          - Vanilla Minecraft install (libraries, assets, natives)
          - Launch + Microsoft (device code) / offline accounts
          - Java 8/17/21 auto detect + Temurin auto download
          - TCL-style UI: home, versions, accounts, settings, logs

          **Kaise chalayein:** \`TurboCraftLauncher-msi\` install karo, ya portable zip extract karke \`TurboCraftLauncher.exe\` chalao. Java pehle se install karne ki zaroorat nahi (runtime saath hai)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "TurboCraftLauncher-${TAG}-windows-portable.zip" --clobber
            gh release upload "$TAG" desktop/build/compose/binaries/main/msi/*.msi --clobber
          else
            gh release create "$TAG" \
              "TurboCraftLauncher-${TAG}-windows-portable.zip" \
              desktop/build/compose/binaries/main/msi/*.msi \
              --title "TurboCraft Launcher $TAG (Windows)" \
              --notes "$NOTES"
          fi
