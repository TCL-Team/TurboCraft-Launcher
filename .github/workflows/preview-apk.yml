name: Preview APK

# Builds an installable test APK (arm64) and keeps it on a rolling PRE-RELEASE, so testers
# always have a download link while the stable build stays separate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Setup Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ndk="$ANDROID_HOME/ndk/25.2.9519653"
          if [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;25.2.9519653"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            sdkmanager --install "cmake;3.22.1"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build arm64 release APK
        run: |
          chmod +x gradlew
          ./gradlew TCL:assembleRelease -Darch=arm64 --console=plain

      - name: Rename artifact
        run: |
          SRC=$(ls TCL/build/outputs/apk/release/*arm64*.apk | head -1)
          cp "$SRC" "TurboCraft-Launcher-preview-arm64.apk"
          echo "APK=$(ls -lh TurboCraft-Launcher-preview-arm64.apk | awk '{print $5}')"

      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          name: "TurboCraft Launcher — preview build (pre-release)"
          prerelease: true
          body: |
            **Testing build — not a stable release.**

            Latest commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`

            Install `TurboCraft-Launcher-preview-arm64.apk` on a 64-bit ARM phone.
            Expect rough edges here; report what breaks in the issue tracker.
          files: TurboCraft-Launcher-preview-arm64.apk
          fail_on_unmatched_files: true
