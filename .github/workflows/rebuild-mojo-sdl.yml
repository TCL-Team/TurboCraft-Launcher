name: Rebuild Mojo SDL without JNI fatal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.3-mojo
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Stop Android_JNI_InitNotify crash
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("TCL/src/main/jni/sdl/src/core/android/SDL_android.c")
          text = p.read_text()
          old = """void Android_JNI_InitNotify()
          {
              JNIEnv *env = Android_JNI_GetEnv();
              (*env)->CallStaticVoidMethod(env, mActivityClass, midNotifyInit);
          }"""
          new = """void Android_JNI_InitNotify()
          {
              /* TCL game thread has no SDLActivity JNI env. Do not crash here. */
              return;
          }"""
          if old not in text:
              raise SystemExit("Android_JNI_InitNotify block not found")
          p.write_text(text.replace(old, new, 1))
          print("patched SDL_android.c")
          aff = Path("TCL/src/main/jni/mojoexec/affinity.c")
          t = aff.read_text()
          if "_GNU_SOURCE" not in t:
              aff.write_text("#define _GNU_SOURCE\n" + t)
          fake = Path("TCL/src/main/jni/mojoexec/driver_helper/fake_dlfcn.c")
          t = fake.read_text()
          if "stdbool.h" not in t:
              fake.write_text("#include <stdbool.h>\n" + t)
          PY

      - name: Build MojoSDL
        run: |
          set -euo pipefail
          cmake -S TCL/src/main/jni/mojo-build -B build-mojo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE -include stdbool.h -include sched.h"
          cmake --build build-mojo --parallel
          mkdir -p TCL/src/main/jniLibs/arm64-v8a
          find build-mojo -name 'libSDL3.so' -exec cp -v {} TCL/src/main/jniLibs/arm64-v8a/ \;
          ls -l TCL/src/main/jniLibs/arm64-v8a/libSDL3.so

      - name: Commit libSDL3.so
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TCL/src/main/jniLibs/arm64-v8a/libSDL3.so
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild Mojo SDL without Android_JNI_InitNotify crash"
          git push origin HEAD:26.3-mojo
