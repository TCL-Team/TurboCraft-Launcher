name: Rebuild Mojo SDL without JNI fatal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.3-mojo
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Patch Android video init
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("TCL/src/main/jni/sdl/src/video/android/SDL_androidvideo.c")
          text = p.read_text()
          key = "bool Android_VideoInit("
          start = 0
          body = None
          while True:
              i = text.find(key, start)
              if i < 0:
                  break
              brace = text.find("{", i)
              semi = text.find(";", i)
              if brace >= 0 and (semi < 0 or brace < semi):
                  end = text.find("\n}", brace)
                  if end < 0:
                      raise SystemExit("function end not found")
                  end += 2
                  body_start = i
                  body = text[body_start:end]
                  break
              start = i + len(key)
          if body is None:
              raise SystemExit("Android_VideoInit body not found")
          body = body.replace("Android_JNI_InitNotify();", "/* no JNI on game thread */")
          body = body.replace("Android_JNI_GetDisplayNaturalOrientation()", "SDL_ORIENTATION_LANDSCAPE")
          body = body.replace("Android_JNI_GetDisplayCurrentOrientation()", "SDL_ORIENTATION_LANDSCAPE")
          body = body.replace("Android_InitTouch();", "/* skip touch JNI */")
          body = body.replace("Android_InitMouse();", "/* skip mouse JNI */")
          if "Android_JNI_" in body:
              raise SystemExit("JNI call still in VideoInit:\n" + body)
          p.write_text(text[:body_start] + body + text[end:])
          print("patched VideoInit body")
          print(body)
          aff = Path("TCL/src/main/jni/mojoexec/affinity.c")
          t = aff.read_text()
          if "_GNU_SOURCE" not in t:
              aff.write_text("#define _GNU_SOURCE\n" + t)
          fake = Path("TCL/src/main/jni/mojoexec/driver_helper/fake_dlfcn.c")
          t = fake.read_text()
          if "stdbool.h" not in t:
              fake.write_text("#include <stdbool.h>\n" + t)
          PY

      - name: Build MojoSDL
        run: |
          set -euo pipefail
          cmake -S TCL/src/main/jni/mojo-build -B build-mojo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE -include stdbool.h -include sched.h"
          cmake --build build-mojo --parallel
          mkdir -p TCL/src/main/jniLibs/arm64-v8a
          find build-mojo -name 'libSDL3.so' -exec cp -v {} TCL/src/main/jniLibs/arm64-v8a/ \;
          ls -l TCL/src/main/jniLibs/arm64-v8a/libSDL3.so

      - name: Commit libSDL3.so
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TCL/src/main/jniLibs/arm64-v8a/libSDL3.so
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild Mojo SDL without Android video JNI"
          git push origin HEAD:26.3-mojo
