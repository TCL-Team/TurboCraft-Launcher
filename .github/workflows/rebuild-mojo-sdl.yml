name: Rebuild Mojo SDL without JNI fatal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.3-mojo
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Patch Android video init
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("TCL/src/main/jni/sdl/src/video/android/SDL_androidvideo.c")
          text = p.read_text()
          start = text.find("bool Android_VideoInit(")
          if start < 0:
              raise SystemExit("Android_VideoInit not found")
          end = text.find("\nstatic SDL_VideoDevice *Android_CreateDevice", start)
          if end < 0:
              raise SystemExit("Android_CreateDevice not found")
          new = '''bool Android_VideoInit(SDL_VideoDevice *_this)
          {
              SDL_VideoData *videodata = _this->internal;
              SDL_DisplayID displayID;
              SDL_VideoDisplay *display;
              SDL_DisplayMode mode;

              videodata->isPaused = false;
              videodata->isPausing = false;
              if (Android_DeviceWidth <= 0) Android_DeviceWidth = 1688;
              if (Android_DeviceHeight <= 0) Android_DeviceHeight = 756;
              if (Android_ScreenRate <= 0.0f) Android_ScreenRate = 60.0f;

              SDL_zero(mode);
              mode.format = Android_ScreenFormat;
              mode.w = Android_DeviceWidth;
              mode.h = Android_DeviceHeight;
              mode.refresh_rate = Android_ScreenRate;

              displayID = SDL_AddBasicVideoDisplay(&mode);
              if (displayID == 0) {
                  return false;
              }
              display = SDL_GetVideoDisplay(displayID);
              display->natural_orientation = SDL_ORIENTATION_LANDSCAPE;
              display->current_orientation = SDL_ORIENTATION_LANDSCAPE;
              display->content_scale = 1.0f;
              return true;
          }

          '''
          p.write_text(text[:start] + new + text[end:])
          print("patched Android_VideoInit")
          aff = Path("TCL/src/main/jni/mojoexec/affinity.c")
          t = aff.read_text()
          if "_GNU_SOURCE" not in t:
              aff.write_text("#define _GNU_SOURCE\n" + t)
          fake = Path("TCL/src/main/jni/mojoexec/driver_helper/fake_dlfcn.c")
          t = fake.read_text()
          if "stdbool.h" not in t:
              fake.write_text("#include <stdbool.h>\n" + t)
          PY

      - name: Build MojoSDL
        run: |
          set -euo pipefail
          cmake -S TCL/src/main/jni/mojo-build -B build-mojo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE -include stdbool.h -include sched.h"
          cmake --build build-mojo --parallel
          mkdir -p TCL/src/main/jniLibs/arm64-v8a
          find build-mojo -name 'libSDL3.so' -exec cp -v {} TCL/src/main/jniLibs/arm64-v8a/ \;
          ls -l TCL/src/main/jniLibs/arm64-v8a/libSDL3.so

      - name: Commit libSDL3.so
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TCL/src/main/jniLibs/arm64-v8a/libSDL3.so
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild Mojo SDL without Android video JNI"
          git push origin HEAD:26.3-mojo
