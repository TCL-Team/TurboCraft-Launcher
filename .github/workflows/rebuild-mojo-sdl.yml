name: Rebuild Mojo SDL without JNI fatal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.3-mojo
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Patch Android video init
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          video = Path("TCL/src/main/jni/sdl/src/video/android/SDL_androidvideo.c")
          text = video.read_text()
          key = "bool Android_VideoInit("
          start = 0
          body_start = None
          while True:
              i = text.find(key, start)
              if i < 0:
                  break
              brace = text.find("{", i)
              semi = text.find(";", i)
              if brace >= 0 and (semi < 0 or brace < semi):
                  end = text.find("\n}", brace)
                  if end < 0:
                      raise SystemExit("function end not found")
                  end += 2
                  body_start = i
                  body = text[body_start:end]
                  break
              start = i + len(key)
          if body_start is None:
              raise SystemExit("Android_VideoInit body not found")
          body = body.replace("Android_JNI_InitNotify();", "/* no JNI */")
          body = body.replace("Android_JNI_GetDisplayNaturalOrientation()", "SDL_ORIENTATION_LANDSCAPE")
          body = body.replace("Android_JNI_GetDisplayCurrentOrientation()", "SDL_ORIENTATION_LANDSCAPE")
          body = body.replace("Android_InitTouch();", "/* skip */")
          body = body.replace("Android_InitMouse();", "/* skip */")
          video.write_text(text[:body_start] + body + text[end:])
          print("patched VideoInit")
          core = Path("TCL/src/main/jni/sdl/src/core/android/SDL_android.c")
          c = core.read_text()
          old = "JNIEnv *env = Android_JNI_GetEnv();\n    (*env)->CallStaticVoidMethod(env, mActivityClass, midNotifyInit);"
          c2 = c.replace(old, "return;", 1)
          if c2 == c:
              print("InitNotify body not exact, leaving it")
          else:
              c = c2
              print("patched InitNotify")
          if "#include <dlfcn.h>" not in c:
              c = "#include <dlfcn.h>\n" + c
          core.write_text(c)
          t = core.read_text()
          mark = "ANativeWindow *Android_JNI_GetNativeWindow"
          j = t.find(mark)
          if j < 0:
              mark = "void *Android_JNI_GetNativeWindow"
              j = t.find(mark)
          if j < 0:
              raise SystemExit("GetNativeWindow signature not found")
          brace = t.find("{", j)
          semi = t.find(";", j)
          if brace < 0 or (semi >= 0 and semi < brace):
              raise SystemExit("GetNativeWindow body not found")
          end = t.find("\n}", brace)
          new = t[j:brace+1] + "\n    void *sym = dlsym(RTLD_DEFAULT, \"tcl_get_native_window\");\n    if (!sym) return NULL;\n    return (ANativeWindow *)((void *(*)(void))sym)();\n}"
          core.write_text(t[:j] + new + t[end+2:])
          print("patched GetNativeWindow")
          aff = Path("TCL/src/main/jni/mojoexec/affinity.c")
          a = aff.read_text()
          if "_GNU_SOURCE" not in a:
              aff.write_text("#define _GNU_SOURCE\n" + a)
          fake = Path("TCL/src/main/jni/mojoexec/driver_helper/fake_dlfcn.c")
          f = fake.read_text()
          if "stdbool.h" not in f:
              fake.write_text("#include <stdbool.h>\n" + f)
          PY

      - name: Build MojoSDL
        run: |
          set -euo pipefail
          cmake -S TCL/src/main/jni/mojo-build -B build-mojo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE -include stdbool.h -include sched.h"
          cmake --build build-mojo --parallel
          mkdir -p TCL/src/main/jniLibs/arm64-v8a
          find build-mojo -name 'libSDL3.so' -exec cp -v {} TCL/src/main/jniLibs/arm64-v8a/ \;
          ls -l TCL/src/main/jniLibs/arm64-v8a/libSDL3.so

      - name: Commit libSDL3.so
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TCL/src/main/jniLibs/arm64-v8a/libSDL3.so
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild Mojo SDL using launcher surface"
          git push origin HEAD:26.3-mojo
