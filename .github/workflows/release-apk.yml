name: Release APKs

# Publishes a versioned release that carries every ABI, in one place:
#   Universal (all four ABIs), arm64-v8a, armeabi-v7a, x86, x86_64
#
# Run it from the Actions tab after the version in TCL/gradle.properties is bumped. The build
# matrix lives in build.yml so the same verification steps run here as on every push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.6)"
        required: true
      prerelease:
        description: "Publish as pre-release (testing build)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: release-apk-*

      - name: Collect and name APKs
        run: |
          set -e
          VERSION=$(grep -E '^launcher_version_name=' TCL/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ./apks

          # One artifact per matrix entry: release-apk-<arch>
          declare -A SUFFIX=(
            [all]="universal"
            [arm64]="arm64-v8a"
            [arm]="armeabi-v7a"
            [x86]="x86"
            [x86_64]="x86_64"
          )
          for arch in "${!SUFFIX[@]}"; do
            src=$(find "./artifacts/release-apk-$arch" -name '*.apk' -type f 2>/dev/null | head -1)
            if [ -z "$src" ]; then
              echo "::error title=missing-apk::no APK produced for $arch"
              exit 1
            fi
            dest="./apks/TurboCraft-Launcher-$VERSION-${SUFFIX[$arch]}.apk"
            cp "$src" "$dest"
            echo "$(basename "$dest") <- $src"
          done

          # Checksums so downloads can be verified
          ( cd ./apks && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -lh ./apks

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: "TurboCraft Launcher ${{ inputs.tag }}"
          body_path: docs/release-notes-v1.6.md
          prerelease: ${{ inputs.prerelease }}
          # Allow re-running the workflow for the same tag to refresh the assets.
          fail_on_unmatched_files: true
          files: |
            ./apks/*.apk
            ./apks/SHA256SUMS.txt
