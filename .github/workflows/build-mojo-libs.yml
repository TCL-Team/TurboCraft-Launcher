name: Build Mojo native libs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.3-mojo
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Patch mojoexec headers
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          aff = Path("TCL/src/main/jni/mojoexec/affinity.c")
          text = aff.read_text()
          if "_GNU_SOURCE" not in text:
              aff.write_text("#define _GNU_SOURCE\n" + text)
              print("patched affinity.c")
          else:
              print("affinity.c already has _GNU_SOURCE")
          fake = Path("TCL/src/main/jni/mojoexec/driver_helper/fake_dlfcn.c")
          text = fake.read_text()
          if "stdbool.h" not in text:
              fake.write_text("#include <stdbool.h>\n" + text)
              print("patched fake_dlfcn.c")
          else:
              print("fake_dlfcn.c already includes stdbool.h")
          PY

      - name: Build MojoSDL, mojoexec, glfw
        run: |
          set -euo pipefail
          echo "NDK=$ANDROID_NDK_HOME"
          cmake -S TCL/src/main/jni/mojo-build -B build-mojo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE -include stdbool.h -include sched.h"
          cmake --build build-mojo --parallel
          mkdir -p TCL/src/main/jniLibs/arm64-v8a
          find build-mojo -name 'libmojoexec.so' -o -name 'libSDL3.so' -o -name 'libglfw.so' \
            | while read -r so; do cp -v "$so" TCL/src/main/jniLibs/arm64-v8a/; done
          ls -l TCL/src/main/jniLibs/arm64-v8a

      - name: Commit libs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TCL/src/main/jniLibs/arm64-v8a/libmojoexec.so \
                  TCL/src/main/jniLibs/arm64-v8a/libSDL3.so \
                  TCL/src/main/jniLibs/arm64-v8a/libglfw.so
          if git diff --cached --quiet; then
            echo "no new libs"
            exit 0
          fi
          git commit -m "Add Mojo arm64 libs for 26.3"
          git push origin HEAD:26.3-mojo
