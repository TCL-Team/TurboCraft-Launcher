name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: ["x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew TCL:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }} 2>&1 | tee /tmp/gradle.log

      - name: Collect build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=/tmp/gradle.log
          if [ ! -f "$LOG" ]; then echo "no gradle log"; exit 0; fi
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|> Task .*FAILED|Execution failed" "$LOG" | head -300 > /tmp/errors.txt || true
          echo "----- tail -----" >> /tmp/errors.txt
          tail -c 4000 "$LOG" >> /tmp/errors.txt
          wc -c /tmp/errors.txt
          {
            printf '{"name":"gradle-errors","head_sha":"%s","status":"completed","conclusion":"neutral","output":{"title":"Gradle errors","summary":' "$GITHUB_SHA"
            python3 -c "import json;print(json.dumps(open('/tmp/errors.txt',errors='replace').read()[:60000]))"
            printf '}}'
          } > /tmp/payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/payload.json && echo "check-run posted" || echo "check-run failed"
          MSG=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(open('/tmp/errors.txt',errors='replace').read()[:30000]))")
          echo "::error title=gradle-errors::$MSG"

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
