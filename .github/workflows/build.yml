name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ndk="$ANDROID_HOME/ndk/25.2.9519653"
          if [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;25.2.9519653"
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew TCL:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Verify PetLib native library
        if: inputs.variant == 'Release'
        run: |
          set -e
          APK=$(ls TCL/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          FOUND=$(unzip -l "$APK" | grep -c "libpetlib\.so" || true)
          echo "libpetlib.so entries: $FOUND"
          unzip -l "$APK" | grep "libpetlib\.so" || true
          if [ "$FOUND" -lt 1 ]; then
            echo "::error title=petlib-missing::libpetlib.so is not packaged in $APK"
            exit 1
          fi
          ABIS=$(unzip -l "$APK" | grep "libpetlib\.so" | awk '{print $4}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ABIs: $ABIS"
          case "${{ matrix.arch }}" in
            all) EXPECT=4 ;;
            *) EXPECT=1 ;;
          esac
          COUNT=$(echo $ABIS | wc -w)
          if [ "$COUNT" -lt "$EXPECT" ]; then
            echo "::error title=petlib-abi::${{ matrix.arch }} APK has $COUNT ABI(s), expected $EXPECT"
            exit 1
          fi
          echo "OK: $COUNT ABI(s) with libpetlib.so"

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
