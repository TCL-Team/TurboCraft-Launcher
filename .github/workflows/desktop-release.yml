name: Desktop Release

# Tag `desktop-v*` push karne par Windows build GitHub release me chala jaata hai.
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build + publish Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build app image + MSI
        run: |
          gradle createDistributable --stacktrace --console=plain
          gradle packageMsi --stacktrace --console=plain

      # Zip ke andar top-level folder + "pehle extract karo" README —
      # warna log zip ke andar se exe dabate hain aur jpackage
      # "app\<name>.cfg: No such file or directory" error deta hai.
      - name: Pack portable zip
        run: |
          cd build/compose/binaries/main/app
          APP_DIR=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_DIR")
          cat > "$APP_DIR/README-PEHLE-PADHO.txt" <<'TXT'
          TurboCraft Launcher (portable)
          ==============================
          ZAROORI: Pehle is zip ko extract karo, phir .exe chalao.
          Zip ke andar se seedha exe dabane par "app\...cfg: No such file
          or directory" error aata hai — kyunki Windows zip ko temp me
          kholta hai aur saath ke app/ + runtime/ folders wahan nahi hote.

          1. Zip par right click -> "Extract All..."
          2. Extract hui folder me jaakar launcher ka .exe chalao
          3. Settings me RAM aur Java apne hisaab se set kar lo

          Agar install karna aasan lage to MSI use karo.
          TXT
          ZIP="$APP_NAME-windows-portable.zip"
          powershell -Command "Compress-Archive -Path '$APP_NAME' -DestinationPath '$ZIP' -Force"
          cp "$ZIP" "$GITHUB_WORKSPACE/"
          echo "PORTABLE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd "$GITHUB_WORKSPACE"
          ZIP="$PORTABLE_ZIP"
          NOTES="## TurboCraft Launcher — Windows ($TAG)

          PC edition ka pehla working MVP (naya Kotlin core, Compose Desktop UI).

          - Vanilla Minecraft install (libraries, assets, natives)
          - Launch + Microsoft (device code) / offline accounts
          - Java 8/17/21 auto detect + Temurin auto download
          - TCL-style UI: home, versions, accounts, settings, logs

          **Kaise chalayein:** MSI install karo, ya portable zip extract karke \`TurboCraftLauncher.exe\` chalao.
          Java pehle se install karne ki zaroorat nahi — runtime saath hai."
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          ### Release assets
          - \`$ZIP\` — portable (extract karke chalao)
          - \`*.msi\` — installer
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release upload "$TAG" desktop/build/compose/binaries/main/msi/*.msi --clobber
          else
            gh release create "$TAG" \
              "$ZIP" \
              desktop/build/compose/binaries/main/msi/*.msi \
              --title "TurboCraft Launcher $TAG (Windows)" \
              --notes "$NOTES"
          fi
