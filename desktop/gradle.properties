# ─────────────────────────────────────────────────────────────────────────────
#  TurboCraft Launcher — desktop (PC) branding
#
#  Sirf yahi file edit karo: naam, version, link, vendor sab jagah badal jayega
#  (window title, UI, data folder, MSI/exe ka naam, release assets, user-agent).
#  Mobile edition ke gradle.properties jaisa hi convention hai.
# ─────────────────────────────────────────────────────────────────────────────

# Poora naam (UI me dikhta hai) — e.g. "TurboCraft Launcher"
launcher_app_name=TurboCraft Launcher

# Bina space wala naam — exe/package/data folder ka naam banta hai
launcher_name=TurboCraftLauncher

# Chhota naam — logo ke initials aur short labels
launcher_short_name=TurboCraft

# Version: code integer badhta rahe, name release ka tag
launcher_version_code=3
launcher_version_name=0.3.0

# Website / GitHub
url_home=https://github.com/TCL-Team/TurboCraft-Launcher

# Windows installer me "Publisher"
launcher_vendor=TCL Team
